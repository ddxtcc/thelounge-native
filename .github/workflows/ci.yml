name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev wayland-protocols libvulkan-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxcb1-dev clang libclang-dev cmake
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: lounge-native-linux-x86_64
            package: lounge-native-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lounge-native-windows-x86_64
            package: lounge-native-x86_64-pc-windows-msvc.zip
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: lounge-native-macos-aarch64
            package: lounge-native-aarch64-apple-darwin.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev wayland-protocols libvulkan-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxcb1-dev clang libclang-dev cmake
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p lounge-native
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/icons
          cp target/${{ matrix.target }}/release/lounge-native dist/
          strip dist/lounge-native
          cp README.md LICENSE packaging/lounge-native.desktop dist/
          install -Dm755 packaging/install.sh dist/install.sh
          cp -r assets/icons/hicolor dist/icons/
          tar -C dist -czf ${{ matrix.package }} .
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lounge-native.exe" dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.package }}" -Force
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lounge-native dist/
          cp README.md LICENSE dist/
          tar -C dist -czf ${{ matrix.package }} .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lounge-native-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="edge"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          elif [ "$tag" = "edge" ]; then
            gh release create "$tag" dist/* --prerelease --title "Lounge Native edge build" --generate-notes
          else
            gh release create "$tag" dist/* --title "Lounge Native $tag" --generate-notes
          fi
