name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxkbcommon-dev libwayland-dev wayland-protocols libvulkan-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxcb1-dev clang libclang-dev cmake
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxkbcommon-dev libwayland-dev wayland-protocols libvulkan-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxcb1-dev clang libclang-dev cmake
      - run: cargo build --release --locked -p lounge-native
      - name: Package
        run: |
          strip target/release/lounge-native
          mkdir -p dist/icons
          cp target/release/lounge-native dist/
          cp README.md LICENSE packaging/lounge-native.desktop dist/
          install -Dm755 packaging/install.sh dist/install.sh
          cp -r assets/icons/hicolor dist/icons/
          tar -C dist -czf lounge-native-x86_64-unknown-linux-gnu.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: lounge-native-linux-x86_64
          path: lounge-native-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lounge-native-linux-x86_64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/lounge-native-x86_64-unknown-linux-gnu.tar.gz --generate-notes --title "Lounge Native $GITHUB_REF_NAME"
