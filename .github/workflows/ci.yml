name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"
      - "*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build release assets for
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev wayland-protocols libvulkan-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxcb1-dev clang libclang-dev cmake libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || inputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: lounge-native-linux-x86_64
            package: lounge-native-x86_64-unknown-linux-gnu.tar.gz
            optional: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lounge-native-windows-x86_64
            package: lounge-native-x86_64-pc-windows-msvc.zip
            optional: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: lounge-native-macos-aarch64
            package: lounge-native-aarch64-apple-darwin.tar.gz
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev wayland-protocols libvulkan-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxcb1-dev clang libclang-dev cmake libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - name: Install GStreamer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GSTREAMER_VERSION: "1.26.7"
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/msvc"
          $files = @(
            "gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.msi",
            "gstreamer-1.0-devel-msvc-x86_64-$env:GSTREAMER_VERSION.msi"
          )
          foreach ($file in $files) {
            Invoke-WebRequest "$base/$file" -OutFile $file
            $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$PWD\$file`" /qn /norestart"
            if ($process.ExitCode -ne 0) {
              throw "GStreamer install failed: $file ($($process.ExitCode))"
            }
          }
          "C:\gstreamer\1.0\msvc_x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=C:\gstreamer\1.0\msvc_x86_64\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install GStreamer
        if: runner.os == 'macOS'
        run: |
          curl -L -o /tmp/gstreamer.pkg "https://gstreamer.freedesktop.org/data/pkg/osx/1.26.7/gstreamer-1.0-1.26.7-universal.pkg"
          curl -L -o /tmp/gstreamer-devel.pkg "https://gstreamer.freedesktop.org/data/pkg/osx/1.26.7/gstreamer-1.0-devel-1.26.7-universal.pkg"
          sudo installer -pkg /tmp/gstreamer.pkg -target /
          sudo installer -pkg /tmp/gstreamer-devel.pkg -target /
          echo "/Library/Frameworks/GStreamer.framework/Versions/1.0/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=/Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p lounge-native
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/icons
          cp target/${{ matrix.target }}/release/lounge-native dist/
          strip dist/lounge-native
          cp README.md LICENSE packaging/lounge-native.desktop dist/
          install -Dm755 packaging/install.sh dist/install.sh
          cp -r assets/icons/hicolor dist/icons/
          tar -C dist -czf ${{ matrix.package }} .
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lounge-native.exe" dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.package }}" -Force
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          app="dist/Lounge Native.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          cp target/${{ matrix.target }}/release/lounge-native "$app/MacOS/lounge-native"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0">'
            echo '<dict>'
            echo '  <key>CFBundleExecutable</key>'
            echo '  <string>lounge-native</string>'
            echo '  <key>CFBundleIdentifier</key>'
            echo '  <string>dev.lounge.native</string>'
            echo '  <key>CFBundleName</key>'
            echo '  <string>Lounge Native</string>'
            echo '  <key>CFBundlePackageType</key>'
            echo '  <string>APPL</string>'
            echo '  <key>LSMinimumSystemVersion</key>'
            echo '  <string>11.0</string>'
            echo '  <key>NSHighResolutionCapable</key>'
            echo '  <true/>'
            echo '</dict>'
            echo '</plist>'
          } > "$app/Info.plist"
          cp README.md LICENSE dist/
          tar -C dist -czf ${{ matrix.package }} .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || inputs.tag != '') && needs.build.result != 'skipped' && needs.build.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lounge-native-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "${RELEASE_TAG}" == "main" ]]; then
            tag="edge"
          else
            tag="${RELEASE_TAG}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          elif [ "$tag" = "edge" ]; then
            gh release create "$tag" dist/* --prerelease --title "Lounge Native edge build" --generate-notes
          else
            gh release create "$tag" dist/* --title "Lounge Native $tag" --generate-notes
          fi
