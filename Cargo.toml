[workspace]
members = ["crates/lounge-core", "crates/lounge-app"]
resolver = "2"

[workspace.package]
version = "0.9.8"
edition = "2024"
license = "MIT"
rust-version = "1.96"
repository = "https://github.com/ddxtcc/thelounge-native"

[workspace.dependencies]
anyhow = "1"
libc = "=0.2.186"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
gpui = "0.2.2"
lounge-core = { path = "crates/lounge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
toml = "0.9"
unicode-segmentation = "1"
url = "2"

[patch.crates-io]
gpui = { path = "vendor/gpui" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
