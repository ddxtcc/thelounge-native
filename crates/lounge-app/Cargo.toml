[package]
name = "lounge-native"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native GPUI client for The Lounge IRC"

[[bin]]
name = "lounge-native"
path = "src/main.rs"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
global-hotkey = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.26"
tauri-winrt-notification = "0.8"
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[features]
default = []
media-video = ["dep:gpui-video-player", "dep:gstreamer", "dep:image", "dep:yuv"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
futures = "0.3"
gpui.workspace = true
gpui-video-player = { version = "=0.1.2", optional = true }
gstreamer = { version = "0.24", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
yuv = { version = "0.8", optional = true }
libc.workspace = true
lounge-core.workspace = true
open = "5"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
unicode-segmentation.workspace = true
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
url.workspace = true
