stages:
  - check
  - build
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null'

default:
  image: rust:1.99-bookworm
  interruptible: true
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_TERM_COLOR: always
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry
      - .cargo/git
      - target
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends pkg-config libssl-dev libxkbcommon-dev libwayland-dev wayland-protocols libvulkan-dev libfontconfig1-dev libfreetype-dev libx11-dev libxcb1-dev clang libclang-dev cmake
    - rustup component add rustfmt clippy
    - cargo fetch --locked

check:
  stage: check
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    - cargo test --workspace --locked

build:
  stage: build
  script:
    - cargo build --release --locked -p lounge-native
    - strip target/release/lounge-native
    - mkdir -p dist/icons
    - cp target/release/lounge-native dist/
    - cp README.md LICENSE packaging/lounge-native.desktop dist/
    - install -Dm755 packaging/install.sh dist/install.sh
    - cp -r assets/icons/hicolor dist/icons/
    - tar -C dist -czf lounge-native-x86_64-unknown-linux-gnu.tar.gz .
  artifacts:
    name: "lounge-native-$CI_COMMIT_REF_SLUG"
    paths:
      - lounge-native-x86_64-unknown-linux-gnu.tar.gz
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build
      artifacts: true
  before_script: []
  cache: []
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Lounge Native $CI_COMMIT_TAG"
    description: "Native GPUI client for The Lounge IRC."
    assets:
      links:
        - name: "Linux x86_64 tarball"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/lounge-native-x86_64-unknown-linux-gnu.tar.gz?job=build"
  rules:
    - if: '$CI_COMMIT_TAG'
